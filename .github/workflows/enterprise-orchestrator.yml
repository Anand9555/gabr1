name: CI-WORKFLOW

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

     

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Build
        run: npm install

      - name: Test
        run: npm test

     

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-1
          path: |
            package.json
            package-lock.json

      - name: Deploy
        run: echo "My code is deployed"

name: NodeJs

on:
  push:
    branches:
      - master

permissions:
  security-events: write
  issues: write
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm install

  test:
     runs-on: ubuntu-latest
     needs: build

     steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: npm test

  deploy:
      runs-on: ubuntu-latest
      needs: test
       
      steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Deploy
        run: echo "My code is deployed"
